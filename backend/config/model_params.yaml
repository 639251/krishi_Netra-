# ML Hyperparameters Configuration
models:
  random_forest:
    n_estimators: 200
    max_depth: 16
    min_samples_split: 4
    min_samples_leaf: 2
    n_jobs: -1
    random_state: 42

  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.8
    random_state: 42

  spatial_neural:
    hidden_layer_sizes: [128, 64, 32]
    activation: "relu"
    alpha: 0.001
    learning_rate_init: 0.01
    max_iter: 300
    random_state: 42

  ensemble:
    meta_learner: "ridge"
    ridge_alpha: 1.0
    weights:
      rf: 0.40
      xgb: 0.45
      cnn: 0.15

bounds:
  temp_max: [-10.0, 55.0]
  temp_min: [-15.0, 40.0]
  rainfall: [0.0, 500.0]
  humidity: [0.0, 100.0]
  wind_speed: [0.0, 200.0]
