heavy_rain_flowering:
  title: "கனமழை எச்சரிக்கை — {crop} ({stage})"
  message: "நாளை {rainfall} மி.மீ கனமழை பெய்யக்கூடும் என்பதால் பூ உதிர்தல் மற்றும் நீர் தேங்குவதை தடுக்க வடிகால் வசதி செய்யுங்கள்."
  action_items:
    - "வயலில் தேங்கிய நீரை உடனே வெளியேற்றுங்கள்"
    - "பூச்சிக்கொல்லி தெளிப்பதை தள்ளிப்போடுங்கள்"

heat_wave:
  title: "கடும் வெப்ப அலை எச்சரிக்கை ({temp_max}°C)"
  message: "வெப்பநிலை {temp_max}°C வரை உயர வாய்ப்புள்ளதால் அதிகாலை அல்லது மாலையில் பயிர்களுக்கு நீர் பாய்ச்சவும்."
  action_items:
    - "அதிகாலையில் தண்ணீர் பாய்ச்சவும்"
    - "ஈரப்பதத்தை காக்க மூடு பயிர் இடுங்கள்"

optimal_spray:
  title: "மருந்து தெளிக்க உகந்த வானிலை"
  message: "காற்று வேகம் குறைவாகவும் ({wind_speed} கி.மீ/மணி) மழை இல்லாததாலும் மருந்து தெளிக்க உகந்த நேரம்."
  action_items:
    - "திட்டமிட்ட மருந்து தெளிப்பை முடிக்கவும்"

pest_disease_risk:
  title: "பூச்சி மற்றும் பூஞ்சை நோய் எச்சரிக்கை"
  message: "அதிக ஈரப்பதம் ({humidity}%) காரணமாக இலைக்கருகல் நோய் பரவ வாய்ப்புள்ளது. பயிர்களை கண்காணிக்கவும்."
  action_items:
    - "இலைகளை ஆய்வு செய்யுங்கள்"

normal_conditions:
  title: "சாதகமான வானிலை ஆலோசனை"
  message: "{crop} பயிர் வளர்ச்சிக்கு வானிலை சாதகமாக உள்ளது. வழக்கமான பணிகளை தொடரலாம்."
  action_items:
    - "வழக்கமான பயிர் பராமரிப்பை தொடரவும்"
