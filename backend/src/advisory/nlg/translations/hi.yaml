heavy_rain_flowering:
  title: "भारी वर्षा चेतावनी — {crop} ({stage})"
  message: "कल {rainfall} मिमी भारी बारिश का अनुमान है, जो {crop} की {stage} अवस्था के लिए जोखिम पैदा कर सकती है। फूलों के झड़ने और जलभराव का खतरा है। तुरंत खेतों में जल निकासी की व्यवस्था करें तथा बारिश थमने के बाद 0.2% बोरेक्स का छिड़काव करें।"
  action_items:
    - "खेतों से जल निकासी की व्यवस्था सुनिश्चित करें"
    - "दवा व खाद का छिड़काव तुरंत स्थगित करें"
    - "जलभराव से जड़ सड़न रोकने के उपाय करें"

heat_wave:
  title: "अत्यधिक तापमान व लू की चेतावनी ({temp_max}°C)"
  message: "तापमान {temp_max}°C तक पहुंचने और नमी {humidity}% रहने की संभावना है। फसलों में नमी बनाए रखने हेतु सुबह या शाम के समय हल्की सिंचाई करें तथा जड़ों के पास पुआल की मल्चिंग करें।"
  action_items:
    - "सुबह या शाम के समय हल्की सिंचाई करें"
    - "मिट्टी की नमी बचाने हेतु मल्चिंग का उपयोग करें"
    - "दोपहर 11 से 3 बजे के बीच खेत में काम से बचें"

optimal_spray:
  title: "कीटनाशक व खाद छिड़काव हेतु अनुकूल मौसम"
  message: "हवा की गति शांत ({wind_speed} किमी/घंटा) और बारिश की संभावना नहीं है। यह कीटनाशक और पोषक तत्वों के छिड़काव के लिए सर्वोत्तम समय है।"
  action_items:
    - "निर्धारित कीटनाशक/फफूंदनाशक का छिड़काव पूरा करें"
    - "पोषक तत्वों का फोलियर स्प्रे करें"

pest_disease_risk:
  title: "कीट व फफूंद रोग का जोखिम (नमी: {humidity}%)"
  message: "उच्च आर्द्रता ({humidity}%) के कारण फसलों में ब्लास्ट, झुलसा या रस चूसक कीटों का खतरा बढ़ सकता है। खेत का नियमित निरीक्षण करें।"
  action_items:
    - "पत्तियों के निचले भाग में कीटों की जांच करें"
    - "लक्षण दिखने पर अनुशंसित फफूंदनाशक का प्रयोग करें"

normal_conditions:
  title: "सामान्य एवं अनुकूल कृषि सलाह"
  message: "मौसम {crop} के विकास के लिए सामान्य एवं अनुकूल है। सामान्य कृषि कार्य जारी रखें।"
  action_items:
    - "नियमित निराई-गुड़ाई व देखभाल जारी रखें"
