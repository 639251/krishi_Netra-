heavy_rain_flowering:
  title: "मुसळधार पाऊस इशारा — {crop} ({stage})"
  message: "उद्या {rainfall} मिमी मुसळधार पावसाची शक्यता आहे. {crop} पिकाच्या {stage} अवस्थेत फुलगळ आणि पाणी साचण्याचा धोका आहे. शेतातील पाण्याचा निचरा तात्काळ करा आणि पाऊस थांबल्यानंतर ०.२% बोरोन फवारणी करा."
  action_items:
    - "शेतात पाणी साचणार नाही याची खात्री करा"
    - "कीटकनाशक फवारणी पुढे ढकला"

heat_wave:
  title: "तीव्र उष्णतेची लाट इशारा ({temp_max}°C)"
  message: "तापमान {temp_max}°C पर्यंत वाढणार असल्याने पिकांना सकाळी लवकर किंवा संध्याकाळी पाणी द्या. बाष्पीभवन रोखण्यासाठी आच्छादन (मल्चिंग) वापरा."
  action_items:
    - "सकाळी किंवा संध्याकाळी हलके पाणी द्या"
    - "मल्चिंगचा वापर करा"

optimal_spray:
  title: "फवारणीसाठी अनुकूल हवामान"
  message: "वाऱ्याचा वेग कमी ({wind_speed} किमी/तास) आणि पाऊस नसल्याने कीटकनाशके व खत फवारणीसाठी आजचा दिवस अत्यंत योग्य आहे."
  action_items:
    - "नियोजित फवारणी पूर्ण करा"

pest_disease_risk:
  title: "बुरशीजन्य रोग व कीड प्रादुर्भाव इशारा"
  message: "हवेतील जास्त आर्द्रतेमुळे ({humidity}%) करपा व बुरशीचा प्रादुर्भाव वाढू शकतो. पिकांचे नियमित निरीक्षण करा."
  action_items:
    - "झाडांची पाने तपासा"

normal_conditions:
  title: "अनुकूल हवामान सल्ला"
  message: "हवामान {crop} पिकासाठी उत्तम आहे. नियमित शेतीची कामे चालू ठेवा."
  action_items:
    - "नियमित मशागत चालू ठेवा"
